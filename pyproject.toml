[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rankforge"
version = "0.1.0"
description = "模块化 Learning to Rank 系统：LightGBM lambdamart + XGBoost + 手写 RankNet 离线旗舰"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "晨星", email = "CJX0712@users.noreply.github.com" }]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "optuna",
]

[tool.setuptools]
packages = ["rankforge"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
